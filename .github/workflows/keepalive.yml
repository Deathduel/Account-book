name: Keep Supabase Alive

on:
  schedule:
    # Run every 5 days at 02:00 UTC (10:00 Beijing Time) to prevent 7-day Supabase free-tier pause
    - cron: '0 2 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          TARGET_URL="${{ vars.APP_URL || 'https://account-book-pr4h.netlify.app' }}/api/health"
          echo "Pinging $TARGET_URL"
          curl -fsS --max-time 30 "$TARGET_URL"
          echo ""
